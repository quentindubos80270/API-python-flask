name: lint and test app

on: [push]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: setup python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: install dependencies
        run: pip install flake8
      - name: run flake8
        run: flake8 .

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v6
      - name: setup python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: install dependencies
        run: pip install -r requirements.txt

      - name: Start Flask app
        run: |
          python app.py &
      
      - name: Wait for API
        run: |
          for i in {1..10}; do
            if curl -s http://localhost:5000/; then
              echo "API is ready"
              break
            fi
            echo "Waiting for API..."
            sleep 2
          done

      - name: run tests
        run: pytest
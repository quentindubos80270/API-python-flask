name: Docker publish to GHCR

on:
    workflow_dispatch:
    workflow_run:
        workflows: ["lint and test app"]
        types:
            - completed

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write

        steps:
            - name: checkout code
              uses: actions/checkout@v6
            - name: Docker login to GHCR
              uses: docker/login-action@v4
              with:
                registry: ghcr.io
                username: ${{ github.actor }}
                password: ${{ secrets.GITHUB_TOKEN }}
            - name: Build Docker Image
              run: docker build -t ghcr.io/quentindubos80270/api-python-flask/api-iscod:latest .
            - name: Push Docker Image to GHCR
              run: docker push ghcr.io/quentindubos80270/api-python-flask/api-iscod:latest